name: Build Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: deploy/tauri
          cache-targets: true
          cache-all-crates: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install workspace dependencies
        run: bun install

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build Windows desktop bundle
        shell: pwsh
        run: bun run desktop:pack

      # Artifact paths: Release builds output to __temp/tauri_dist
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rv-windows-x86_64-pc-windows-msvc
          if-no-files-found: error
          path: |
            __temp/tauri_dist/release/bundle/nsis/*.exe
