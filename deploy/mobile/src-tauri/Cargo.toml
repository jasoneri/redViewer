[package]
name = "redviewer-mobile"
version = "1.7.0"
description = "redViewer Android offline reader and CGS capture client"
authors = ["jasoneri"]
license = "Apache-2.0"
edition = "2024"
rust-version = "1.92"

[lib]
name = "redviewer_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "redviewer-mobile"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.5.3", features = ["config-json5"] }

[dependencies]
tauri = { version = "=2.9.5", features = ["config-json5"] }
# Avoid OpenSSL when cross-compiling Android from Windows. The default reqwest
# TLS stack pulls in openssl-sys, which requires a target OpenSSL sysroot.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
log = "0.4"
